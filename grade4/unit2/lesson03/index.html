<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة قابلية القسمة على ٢ - الصف الرابع</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ffdee9, #b5fffc);
            color: #333;
            overflow-x: hidden;
            padding-bottom: 60px;
        }
        header {
            background: #6c5ce7;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .character {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            z-index: 100;
            transition: all 0.3s;
            cursor: pointer;
        }
        .guide-bubble {
            position: fixed;
            bottom: 150px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            max-width: 250px;
            z-index: 101;
            display: none;
            border: 2px solid #a29bfe;
        }
        .guide-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 30px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .game-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stage-header {
            background: #a29bfe;
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.4em;
            font-weight: bold;
        }
        button {
            background: #fdcb6e;
            color: #2d3436;
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
        }
        button:hover {
            transform: scale(1.05);
            background: #ff7675;
            color: white;
        }
        .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
        }
        .drop-zone {
            border: 3px dashed #a29bfe;
            padding: 20px;
            min-height: 100px;
            border-radius: 15px;
            margin: 15px 0;
            background: #fdfdfd;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="number"], input[type="text"] {
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 1.2em;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            margin: 10px;
            width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 1.2em;
        }
        th, td {
            border: 2px solid #dfe6e9;
            padding: 12px;
            text-align: center;
        }
        th { background: #a29bfe; color: white; }
        .table-select {
            padding: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 1em;
            border-radius: 5px;
        }
        ol {
            text-align: right;
            display: inline-block;
            margin: 20px auto;
        }
        ol li {
            padding: 10px 20px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            background: #f1f2f6;
            transition: all 0.2s;
        }
        ol li:hover { background: #dfe4ea; }
    </style>
</head>
<body>

    <header>
        <h1>🧠 مغامرة قابلية القسمة على ٢ 🧠</h1>
        <p>الأعداد الزوجية والفردية - الصف الرابع الابتدائي</p>
    </header>

    <div class="guide-bubble" id="guideBubble"></div>
    <img id="guide" class="character" src="https://via.placeholder.com/120x150/6c5ce7/ffffff?text=🦊" alt="المرشد" onclick="triggerGuideSpeech()">

    <div class="game-container" id="mainContainer">
        </div>

    <script>
        let score = 0;
        let finalChallengeIndex = 0;

        const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        function toEasternArabic(num) {
            if (num === null || num === undefined) return '';
            return num.toString().replace(/\d/g, d => arabicDigits[d]);
        }

        const guideMessages = [
            "مرحباً بك يا بطل! أنا ثعلب الرياضيات، واليوم سنكتشف معاً سر الأعداد الزوجية وقابليتها للقسمة على ٢! 🦊",
            "جرّب تقسيم الأعداد بنفسك لترى من منها يترك باقياً ومن ينقسم بسلام!",
            "مذهل! لقد لاحظت النمط بنجاح 🎉",
            "القاعدة أصبحت بين يديك الآن، دعنا نطبقها!",
            "أنت عبقري رياضيات حقاً!"
        ];

        function updateGuide(text) {
            const bubble = document.getElementById('guideBubble');
            if (bubble) {
                bubble.textContent = text;
                bubble.style.display = 'block';
            }
        }

        function triggerGuideSpeech() {
            updateGuide("انظر لآحاد العدد دائماً لتكتشف السر بسرعة! 🦊");
        }

        function playSound(isSuccess) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audio = new AudioContext();
                const oscillator = audio.createOscillator();
                const gainNode = audio.createGain();
                oscillator.frequency.setValueAtTime(isSuccess ? 900 : 350, audio.currentTime);
                oscillator.type = 'sine';
                oscillator.connect(gainNode);
                gainNode.connect(audio.destination);
                oscillator.start();
                gainNode.gain.setValueAtTime(0.2, audio.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.3);
                oscillator.stop(audio.currentTime + 0.3);
            } catch(e) { 
                console.log("Audio play blocked"); 
            }
        }

        // المرحلة 0: البداية
        function startGame() {
            score = 0;
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">مرحباً بك في تحدي الأعداد الزوجية!</div>
                <div style="text-align:center; padding:40px;">
                    <h2>🦊 رحلة البحث عن الرقم التوأم</h2>
                    <p style="font-size:1.5em; margin:30px 0;">
                        سنتعلم اليوم متى يقبل العدد القسمة على ${toEasternArabic(2)} بدون باقي، وكيف نميز العدد الزوجي من الفردي لنهزم التحديات!
                    </p>
                    <button onclick="stage1_Curiosity()" style="font-size:1.6em; padding:20px 50px;">
                        انطلق للمغامرة 🚀
                    </button>
                </div>
            `;
            setTimeout(() => { updateGuide(guideMessages[0]); }, 200);
        }

        // المرحلة ١: إثارة الفضول
        function stage1_Curiosity() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ١: إثارة الفضول 🧐</div>
                <h2 style="text-align:center; margin:20px;">تأمل معي هذه الملاحظة الذكية:</h2>
                <p style="font-size:1.5em; text-align:center; margin:30px; line-height:2.2; background:#f9f9f9; padding:20px; border-radius:15px;">
                    الأعداد التالية تقبل القسمة على ${toEasternArabic(2)}: <br>
                    <strong>${toEasternArabic(2)}، ${toEasternArabic(4)}، ${toEasternArabic(6)}، ${toEasternArabic(8)}، ${toEasternArabic(10)}، ${toEasternArabic(12)}، ${toEasternArabic(20)}، ${toEasternArabic(30)}، ${toEasternArabic(36)}</strong>
                </p>
                <h3 style="margin:20px; color:#6c5ce7;">هل تعتقد أن هذه الأعداد زوجية أم فردية؟ ولماذا؟</h3>
                <button onclick="stage2_Exploration()">دعنا نختبر ذلك بأنفسنا تفاعلياً! 🚀</button>
            `;
            updateGuide("فكر في أرقام الآحاد لهذه الأعداد المحبوبة!");
        }

        // المرحلة ٢: نشاط استكشافي
        let demoA = 0;
        function stage2_Exploration() {
            demoA = 0;
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٢: المختبر الاستكشافي 🧪</div>
                <h3>اختر عدداً من الأزرار بالأسفل لتقسيمه على الساحر المساعد (${toEasternArabic(2)}):</h3>
                
                <div style="margin: 25px 0; font-size: 1.2em;">
                    <button onclick="setDemoNumber(18)">تجربة العدد: ${toEasternArabic(18)}</button>
                    <button onclick="setDemoNumber(21)">تجربة العدد: ${toEasternArabic(21)}</button>
                    <button onclick="setDemoNumber(22)">تجربة العدد: ${toEasternArabic(22)}</button>
                    <button onclick="setDemoNumber(25)">تجربة العدد: ${toEasternArabic(25)}</button>
                </div>

                <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:20px; margin:30px 0;">
                    <div class="drop-zone" style="min-width:200px;">العدد المختار (المقسوم): <span id="valA" class="number">-</span></div>
                    <div class="drop-zone" style="min-width:200px;">المقسوم عليه الثابت: <span class="number">${toEasternArabic(2)}</span></div>
                </div>
                <div id="resultArea" style="text-align:center; font-size:1.5em; min-height:80px; color: #2c3e50; font-weight:bold;"></div>
                <button onclick="checkDivisibilityDemo()" style="background:#55efc4;">اضغط لتشغيل آلة القسمة ⚙️</button>
                <button onclick="stage3_Observation()">التالي لمعاينة النتائج ➡️</button>
            `;
            updateGuide(guideMessages[1]);
        }

        function setDemoNumber(num) {
            demoA = num;
            document.getElementById('valA').textContent = toEasternArabic(num);
            document.getElementById('resultArea').innerHTML = "";
        }

        function checkDivisibilityDemo() {
            if(demoA === 0) {
                alert("الرجاء اختيار عدد من الأزرار أولاً لتجربته!");
                return;
            }
            const q = Math.floor(demoA / 2);
            const r = demoA % 2;
            const resultArea = document.getElementById('resultArea');
            
            if(r === 0) {
                resultArea.innerHTML = `🎉 ${toEasternArabic(demoA)} ÷ ${toEasternArabic(2)} = ${toEasternArabic(q)} والآحاد زوجي، الباقي صفر (يقبل القسمة! ✅)`;
                playSound(true);
            } else {
                resultArea.innerHTML = `⚡ ${toEasternArabic(demoA)} ÷ ${toEasternArabic(2)} = ${toEasternArabic(q)} والباقي ${toEasternArabic(r)} (يوجد باقي، لا يقبل القسمة ❌)`;
                playSound(false);
            }
            score += 10;
        }

        // المرحلة ٣: ملاحظة النتائج
        function stage3_Observation() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٣: منصة الملاحظة الذكية 🔎</div>
                <h3>ماذا استنتجت من تجاربك في المختبر؟</h3>
                <div style="background:#f1f2f6; padding:25px; border-radius:15px; margin:20px 0; text-align:right; line-height:2.2;">
                    <p style="font-size:1.4em;">• الأعداد مثل <strong>${toEasternArabic(18)}، ${toEasternArabic(22)}، ${toEasternArabic(24)}</strong> آحادها زوجي وتنقسم بدون باقي، فهي <strong style="color:#27ae60;">تقبل القسمة على ٢</strong>.</p>
                    <p style="font-size:1.4em;">• الأعداد مثل <strong>${toEasternArabic(21)}، ${toEasternArabic(25)}</strong> يتبقى دائماً منها واحد، فهي <strong style="color:#c0392b;">لا تقبل القسمة على ٢</strong>.</p>
                    <p style="font-size:1.4em; text-align:center; margin-top:15px; color:#6c5ce7; font-weight:bold;">هل لاحظت أن رقم الآحاد هو المفتاح السحري دائماً؟ 🔑</p>
                </div>
                <button onclick="stage4_Conclusion()">هيا بنا لنصيغ القاعدة الذهبية! 🚀</button>
            `;
            updateGuide(guideMessages[2]);
        }
        // المرحلة ٤: استنتاج المفهوم
        function stage4_Conclusion() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٤: استنتاج المفهوم الذهبي 🧠</div>
                <h3 style="color:#2c3e50;">أكمل الفراغ لتكتشف القاعدة بنفسك:</h3>
                <p style="font-size:1.4em; margin:30px 0;">
                    يقبل العدد القسمة على ${toEasternArabic(2)} إذا كان رقم أحاده عدداً...
                </p>
                <input type="text" id="studentConclusion" placeholder="اكتب (زوجياً) أو (فردياً)" style="width:280px;">
                <br>
                <button onclick="checkConclusion()">تحقق من عبقريتك 💎</button>
            `;
        }

        function checkConclusion() {
            const answer = document.getElementById('studentConclusion').value.trim();
            if (answer.includes('زوجي') || answer.includes('زوجياً')) {
                score += 20;
                playSound(true);
                alert("🎉 مذهل! استنتاجك في غاية الدقة. يكون رقم الآحاد زوجياً.");
                stage5_SimpleExplanation();
            } else {
                playSound(false);
                alert("فكر مجدداً يا بطل... انظر للأعداد (٠، ٢، ٤، ٦، ٨)، ماذا نسمي هذه الأعداد؟");
            }
        }

        // المرحلة ٥: الشرح المبسط والتعاريف الرسمية
        function stage5_SimpleExplanation() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٥: قاموس الثعلب الرياضي 📘</div>
                <div style="background:#f5f6fa; padding:25px; border-radius:15px; text-align:right; line-height:2.4;">
                    <h2 style="text-align:center; color:#6c5ce7; margin-bottom:15px;">التعاريف والقواعد الرسمية للدرس:</h2>
                    <p style="font-size:1.3em;">⭐ <strong>العدد الزوجي:</strong> هو العدد الذي يقبل القسمة على ${toEasternArabic(2)} بدون باقي.</p>
                    <p style="font-size:1.3em;">⭐ <strong>العدد الفردي:</strong> هو العدد الذي لا يقبل القسمة على ${toEasternArabic(2)} (ويتبقى منه ${toEasternArabic(1)}).</p>
                    <div style="background:#e8f5e9; padding:15px; border-radius:10px; margin-top:15px; text-align:center;">
                        <p style="font-size:1.4em; color:#27ae60; font-weight:bold;">💡 القاعدة السحرية 💡</p>
                        <p style="font-size:1.3em; color:#2d3436;">يقبل العدد القسمة على ${toEasternArabic(2)} إذا كان رقم آحاده هو: <br><strong>[ ${toEasternArabic(0)} أو ${toEasternArabic(2)} أو ${toEasternArabic(4)} أو ${toEasternArabic(6)} أو ${toEasternArabic(8)} ]</strong></p>
                    </div>
                </div>
                <button onclick="stage6_InteractiveExample(1)">لنطبق معاً على أمثلة الكتاب 🚀</button>
            `;
            updateGuide(guideMessages[3]);
        }

        // المرحلة ٦: مثال تفاعلي (أمثلة الكتاب المدرسي)
        function stage6_InteractiveExample(exampleNum) {
            const container = document.getElementById('mainContainer');
            if(exampleNum === 1) {
                container.innerHTML = `
                    <div class="stage-header">المرحلة ٦: تطبيق أمثلة الكتاب (مثال ١) 📋</div>
                    <h3>اختبر ذكاءك: لماذا يعتبر العدد <strong>${toEasternArabic(18)}</strong> عدداً زوجياً؟</h3>
                    <p style="margin:20px; font-size:1.3em;">لأن ناتج قسمة ${toEasternArabic(18)} ÷ ${toEasternArabic(2)} يساوي كم وبدون باقي؟</p>
                    <input type="number" id="quotient1" placeholder="الناتج">
                    <br>
                    <button onclick="checkExample1()">إرسال الإجابة</button>
                `;
            } else {
                container.innerHTML = `
                    <div class="stage-header">تطبيق أمثلة الكتاب (مثال ٢) 📋</div>
                    <h3>العدد <strong>${toEasternArabic(63)}</strong> لا يقبل القسمة على ${toEasternArabic(2)}، والسبب هو:</h3>
                    <div style="margin:20px 0;">
                        <button onclick="checkExample2(false)">لأن آحاده عدد زوجي</button>
                        <button onclick="checkExample2(true)">لأن رقم آحاده ليس (٠ أو ٢ أو ٤ أو ٦ أو ٨)</button>
                    </div>
                `;
            }
        }

        function checkExample1() {
            const quot = document.getElementById('quotient1').value;
            if (quot == 9 || quot == '٩') {
                score += 25;
                playSound(true);
                alert("✅ رائع! لأن ١٨ ÷ ٢ = ٩ وبدون باقي، فهو عدد زوجي.");
                stage6_InteractiveExample(2);
            } else {
                playSound(false);
                alert("راجع جدول الضرب للعدد ٢ لتجد الإجابة الصحيحة!");
            }
        }

        function checkExample2(isCorrect) {
            if(isCorrect) {
                score += 25;
                playSound(true);
                alert("✅ إجابة ممتازة ومطابقة للكتاب! العدد ٦٣ آحاده ٣ وهو ليس زوجياً.");
                stage7_GuidedPractice();
            } else {
                playSound(false);
                alert("انتبه يا بطل، رقم آحاد العدد ٦٣ هو ٣ وهو عدد فردي وليس زوجياً!");
            }
        }

        // المرحلة ٧: تدريب موجه
        function stage7_GuidedPractice() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٧: التدريب الموجه والمحمي 🛠️</div>
                <h3>أكمل الجملة البرمجة التالية لاختبار العدد <strong>${toEasternArabic(50)}</strong>:</h3>
                <p style="font-size:1.3em; margin:20px;">
                    العدد ${toEasternArabic(50)} يقبل القسمة على ${toEasternArabic(2)} لأن رقم آحاده هو...
                </p>
                <input type="text" id="guidedAns" placeholder="اكتب رقم الآحاد رقماً">
                <br>
                <button onclick="checkGuided()">تحقق من التدريب</button>
            `;
        }

        function checkGuided() {
            const ans = document.getElementById('guidedAns').value.trim();
            if(ans == '0' || ans == '٠' || ans === 'صفر') {
                score += 30;
                playSound(true);
                alert("✅ عبقري! نعم آحاده صفر، والصفر يفتح باب قابلية القسمة على ٢ مجاناً.");
                stage8_IndependentPractice();
            } else {
                playSound(false);
                alert("تلميح 🦊: انظر إلى الرقم الأول على اليمين في العدد ٥٠!");
            }
        }

        // المرحلة ٨: تدريب مستقل
        function stage8_IndependentPractice() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٨: ميدان التحدي المستقل 🎯</div>
                <h3>من تمرين الكتاب المدرسي: اضغط على الأعداد التي (تقبل القسمة على ٢) لتلوينها بالأخضر:</h3>
                <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:15px; margin:30px 0;">
                    <button onclick="selectNumber(29, this)">${toEasternArabic(29)}</button>
                    <button onclick="selectNumber(26, this)">${toEasternArabic(26)}</button>
                    <button onclick="selectNumber(23, this)">${toEasternArabic(23)}</button>
                    <button onclick="selectNumber(19, this)">${toEasternArabic(19)}</button>
                    <button onclick="selectNumber(8, this)">${toEasternArabic(8)}</button>
                    <button onclick="selectNumber(42, this)">${toEasternArabic(42)}</button>
                </div>
                <div id="feedback" style="min-height:50px; font-weight:bold; font-size:1.3em;"></div>
                <button onclick="stage9_Challenge()" style="background:#6c5ce7; color:white;">الانتقال إلى لوحة الاختبارات ➡️</button>
            `;
            updateGuide("قم بفحص الآحاد لكل زر مستقل أمامي!");
        }

        function selectNumber(num, btn) {
            const feedback = document.getElementById('feedback');
            if (num % 2 === 0) {
                feedback.innerHTML = `<p style="color:#27ae60;">✅ رائع! العدد ${toEasternArabic(num)} يقبل القسمة لأن آحاده عدد زوجي.</p>`;
                btn.style.background = "#2ecc71";
                btn.style.color = "white";
                score += 15;
                playSound(true);
            } else {
                feedback.innerHTML = `<p style="color:#c0392b;">❌ خطأ! العدد ${toEasternArabic(num)} لا يقبل القسمة (آحاده فردي وباقي قسمته هو ١).</p>`;
                btn.style.background = "#e74c3c";
                btn.style.color = "white";
                playSound(false);
            }
        }
        // المرحلة ٩: تحدٍ قصير (التأكيد السريع)
        function stage9_Challenge() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٩: التحدي البرق الخاطف ⚡</div>
                <h3>اضغط على العبارة الصحيحة علمياً فيما يلي:</h3>
                <ol style="font-size:1.4em; line-height: 2.5;">
                    <li onclick="quickCheck(this, true)">العدد الزوجي دائماً يقبل القسمة على ٢ بدون باقي.</li>
                    <li onclick="quickCheck(this, false)">جميع الأعداد الفردية تقبل القسمة على ٢ وبباقي صفر.</li>
                    <li onclick="quickCheck(this, true)">إذا كان آحاد العدد (٠) فإنه عدد زوجي ويقبل القسمة على ٢.</li>
                </ol>
                <br>
                <button onclick="stage10_FinalFeedback()" style="background:#6c5ce7; color:white;">انتقل للوحة النقاط والتهنئة 🌟</button>
            `;
        }

        function quickCheck(el, isCorrectAnswer) {
            if (isCorrectAnswer) {
                el.style.background = '#2ecc71';
                el.style.color = 'white';
                score += 15;
                playSound(true);
            } else {
                el.style.background = '#e74c3c';
                el.style.color = 'white';
                playSound(false);
            }
        }

        // المرحلة ١٠: التهنئة التمهيدية والتحضير للجدول
        function stage10_FinalFeedback() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header" style="background:#6c5ce7;">المرحلة ١٠: رائع جداً يا بطل! 🎉</div>
                <h2 style="text-align:center; margin:40px;">لقد اجتزت الأقسام المفاهيمية لدرس "قابلية القسمة على ٢"</h2>
                <p style="font-size:2em; text-align:center;">مجموع نقاطك التراكمية الحالي هو: <span style="color:#e67e22; font-weight:bold;">${toEasternArabic(score)}</span></p>
                <br><br>
                <button onclick="startTableActivity()" style="background:#2d3436; color:white; font-size:1.3em; padding:15px 40px;">الآن ننتقل إلى الجدول التفاعلي الكبير 📊</button>
            `;
        }

        // نشاط الجدول التفاعلي
        function startTableActivity() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">نشاط الجدول التفاعلي الشامل للدرس</div>
                <p style="margin:10px; font-size:1.2em;">حدد لكل عدد من جدول التمرين هل هو (زوجي) أم (فردي) بناءً على قاعدة الآحاد:</p>
                <table style="width:100%; border-collapse:collapse; margin:20px 0;">
                    <tr style="background:#a29bfe; color:white;">
                        <th>العدد المدرج</th><th>رقم الآحاد</th><th>نوع العدد (زوجي / فردي)</th><th>هل يقبل القسمة على ٢؟</th>
                    </tr>
                    <tr>
                        <td><strong>${toEasternArabic(24)}</strong></td>
                        <td>${toEasternArabic(4)}</td>
                        <td>زوجي</td>
                        <td>نعم</td>
                    </tr>
                    <tr>
                        <td><strong>${toEasternArabic(19)}</strong></td>
                        <td><select id="tab19_r" class="table-select"><option value="٩">${toEasternArabic(9)}</option><option value="١">${toEasternArabic(1)}</option></select></td>
                        <td><select id="tab19_t" class="table-select"><option value="فردي">فردي</option><option value="زوجي">زوجي</option></select></td>
                        <td><select id="tab19_d" class="table-select"><option value="لا">لا</option><option value="نعم">نعم</option></select></td>
                    </tr>
                    <tr>
                        <td><strong>${toEasternArabic(50)}</strong></td>
                        <td><select id="tab50_r" class="table-select"><option value="٠">${toEasternArabic(0)}</option><option value="٥">${toEasternArabic(5)}</option></select></td>
                        <td><select id="tab50_t" class="table-select"><option value="زوجي">زوجي</option><option value="فردي">فردي</option></select></td>
                        <td><select id="tab50_d" class="table-select"><option value="نعم">نعم</option><option value="لا">لا</option></select></td>
                    </tr>
                    <tr>
                        <td><strong>${toEasternArabic(21)}</strong></td>
                        <td><select id="tab21_r" class="table-select"><option value="١">${toEasternArabic(1)}</option><option value="٢">${toEasternArabic(2)}</option></select></td>
                        <td><select id="tab21_t" class="table-select"><option value="فردي">فردي</option><option value="زوجي">زوجي</option></select></td>
                        <td><select id="tab21_d" class="table-select"><option value="لا">لا</option><option value="نعم">نعم</option></select></td>
                    </tr>
                </table>
                <button onclick="fillTable()">فحص وتدقيق الجدول ⚙️</button>
            `;
        }

        function fillTable() {
            const r19 = document.getElementById('tab19_r').value;
            const t19 = document.getElementById('tab19_t').value;
            const d19 = document.getElementById('tab19_d').value;

            const r50 = document.getElementById('tab50_r').value;
            const t50 = document.getElementById('tab50_t').value;
            const d50 = document.getElementById('tab50_d').value;

            const r21 = document.getElementById('tab21_r').value;
            const t21 = document.getElementById('tab21_t').value;
            const d21 = document.getElementById('tab21_d').value;

            if(r19 === "٩" && t19 === "فردي" && d19 === "لا" &&
               r50 === "٠" && t50 === "زوجي" && d50 === "نعم" &&
               r21 === "١" && t21 === "فردي" && d21 === "لا") {
                
                alert("✅ جدول متقن وصحيح ١٠٠٪! أنت مستعد للتحدي النهائي.");
                score += 50;
                playSound(true);
                startFinalChallenge();
            } else {
                playSound(false);
                alert("تنبيه من الثعلب 🦊: بعض الخيارات في الجدول غير دقيقة، تذكر فحص رقم الآحاد جيداً للأعداد ١٩، ٥٠، ٢١.");
            }
        }

        // التحدي النهائي الشامل المكون من 15 سؤالاً رياضياتياً دقيقاً ومطابقاً
        const finalQuestionsSet = [
            { q: "ما هو رقم آحاد العدد ٢٦؟", choiceA: "٦", choiceB: "٢", correct: "A" },
            { q: "هل العدد ٢٩ عدد زوجي أم فردي؟", choiceA: "زوجي", choiceB: "فردي", correct: "B" },
            { q: "العدد الذي يقبل القسمة على ٢ يسمى عدداً:", choiceA: "زوجياً", choiceB: "فردياً", correct: "A" },
            { q: "إذا قمنا بقسمة العدد ٢٣ على ٢، كم يكون باقي القسمة؟", choiceA: "صفر", choiceB: "١", correct: "B" },
            { q: "أي من الأعداد التالية يقبل القسمة على ٢ بدون باقي؟", choiceA: "٨", choiceB: "٩", correct: "A" },
            { q: "العدد الذي لا يقبل القسمة على ٢ يسمى عدداً فردياً:", choiceA: "عبارة صحيحة", choiceB: "عبارة خاطئة", correct: "A" },
            { q: "هل العدد ٤٢ يقبل القسمة على ٢؟", choiceA: "نعم، لأن آحاده ٢", choiceB: "لا، لأن آحاده ٢", correct: "A" },
            { q: "رقم آحاد العدد ٥٠ هو صفر، هل الصفر عدد يجعل الكل يقبل القسمة على ٢؟", choiceA: "نعم", choiceB: "لا", correct: "A" },
            { q: "لماذا لا يقبل العدد ٦٣ القسمة على ٢؟", choiceA: "لأن آحاده عدد فردي وهو ٣", choiceB: "لأن آحاده ٦", correct: "A" },
            { q: "أي من الأرقام التالية إذا وجد في الآحاد يجعل العدد زوجياً؟", choiceA: "٤", choiceB: "٧", correct: "A" },
            { q: "العدد ٢٢ يقبل القسمة على ٢ لأن ناتج القسمة هو ١١ والباقي صفر:", choiceA: "عبارة صحيحة", choiceB: "عبارة خاطئة", correct: "A" },
            { q: "العدد ٢٥ يعتبر عدداً:", choiceA: "زوجياً", choiceB: "فردياً", correct: "B" },
            { q: "هل الأعداد الفردية ٥، ٧، ٩ تقبل القسمة على ٢؟", choiceA: "نعم تقبل", choiceB: "لا تقبل", correct: "B" },
            { q: "جميع الأعداد الزوجية يجب أن تبدأ بآحاد هو ٠، ٢، ٤، ٦، أو ٨:", choiceA: "عبارة صحيحة", choiceB: "عبارة خاطئة", correct: "A" },
            { q: "ما ناتج قسمة ٢٤ ÷ ٢؟", choiceA: "١٢ وبدون باقي", choiceB: "١٠ والباقي ٢", correct: "A" }
        ];

        function startFinalChallenge() {
            finalChallengeIndex = 0;
            renderChallengeQuestion();
        }

        function renderChallengeQuestion() {
            const container = document.getElementById('mainContainer');
            if (finalChallengeIndex < finalQuestionsSet.length) {
                const currentQ = finalQuestionsSet[finalChallengeIndex];
                container.innerHTML = `
                    <div class="stage-header" style="background:#ff7675; color:white;">التحدي الختامي النهائي - السؤال (${toEasternArabic(finalChallengeIndex + 1)} من ${toEasternArabic(15)})</div>
                    <p style="text-align:center; font-size:1.6em; margin:30px; font-weight:bold; color:#2d3436;">${currentQ.q}</p>
                    <div>
                        <button onclick="answerFinal('A')" style="font-size:1.2em; padding:15px 35px; background:#6c5ce7; color:white;">${currentQ.choiceA}</button>
                        <button onclick="answerFinal('B')" style="font-size:1.2em; padding:15px 35px; background:#6c5ce7; color:white;">${currentQ.choiceB}</button>
                    </div>
                    <p style="margin-top:25px; color:#7f8c8d; font-size:1.1em;">النقاط الحالية المحرزة: ${toEasternArabic(score)}</p>
                `;
            } else {
                completeGame();
            }
        }

        function answerFinal(studentChoice) {
            const currentQ = finalQuestionsSet[finalChallengeIndex];
            if (studentChoice === currentQ.correct) {
                score += 20;
                playSound(true);
                alert("✅ رائع! إجابتك صحيحة وموفقة.");
            } else {
                playSound(false);
                alert("❌ إجابة لم تحالفها الصحة، ركز في السؤال القادم لتدارك الإجابة!");
            }
            finalChallengeIndex++;
            renderChallengeQuestion();
        }

        function completeGame() {
            const container = document.getElementById('mainContainer');
            const totalStars = Math.min(5, Math.floor(score / 90));
            
            container.innerHTML = `
                <div style="text-align:center; padding:60px 20px; background:linear-gradient(#ffd700, #fffa65); border-radius:25px; box-shadow:0 10px 20px rgba(0,0,0,0.15);">
                    <h1 style="font-size:3em; color:#2d3436;">🎉 بطل الأعداد الزوجية والفردية! 🎉</h1>
                    <p style="font-size:2em; margin:25px 0; color:#2d3436;">لقد أتممت الدرس واجتزت كافة التدريبات بنجاح باهر!</p>
                    <div style="font-size:4.5em; margin:20px; letter-spacing:10px;">${'⭐'.repeat(totalStars === 0 ? 1 : totalStars)}</div>
                    <p style="font-size:1.8em; color:#2d3436;">مجموع نقاطك النهائية الاستثنائية: <strong>${toEasternArabic(score)}</strong></p>
                    <br>
                    <button onclick="startGame()" style="background:#2ecc71; color:white; padding:20px 45px; font-size:1.4em; border-radius:50px;">
                        إعادة التحدي والمغامرة من جديد 🔄
                    </button>
                </div>
            `;
            playSound(true);
            updateGuide("أنا فخور جداً بك يا بطل! لقد أحرزت النجوم كاملة! 🦊");
        }

        window.onload = function() {
            startGame();
        };
    </script>
</body>
</html>
