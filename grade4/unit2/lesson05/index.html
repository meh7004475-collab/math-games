<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الأرقام: سر الرقم ٥ السحري 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            color: #006064;
            min-height: 100vh;
            padding-bottom: 60px;
            text-align: right;
        }

        header {
            background: #00838f;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-bottom: 5px solid #00acc1;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 5px;
            font-weight: 900;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* الشخصية التفاعلية */
        .character-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 100px;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .character-box:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .guide-bubble {
            position: fixed;
            bottom: 130px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-width: 280px;
            z-index: 101;
            border: 3px solid #00838f;
            font-weight: bold;
            font-size: 1em;
            line-height: 1.5;
        }

        .guide-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 35px;
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        /* حاوية اللعبة الرئيسية */
        .game-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            min-height: 480px;
            position: relative;
        }

        .stage-header {
            background: #00acc1;
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.4em;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        /* تصميم الجداول والبطاقات التفاعلية من الكتاب */
        .book-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
        }

        .book-table th, .book-table td {
            border: 2px solid #b2ebf2;
            padding: 12px;
            user-select: none;
        }

        .book-table th {
            background-color: #e0f2f1;
            color: #00796b;
        }

        /* تعديل خلايا الجدول لتصبح تفاعلية وقابلة للضغط الفعلي */
        .clickable-cell {
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clickable-cell:hover {
            background-color: #e0f7fa;
            transform: scale(1.05);
        }

        .clickable-cell.selected-correct {
            background-color: #a5d6a7 !important;
            color: #1b5e20 !important;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
        }

        .highlight-red {
            color: #d32f2f;
            font-size: 1.5em;
            font-weight: 900;
        }

        /* الأزرار وتفاعلاتها */
        button {
            background: #00acc1;
            color: white;
            border: none;
            padding: 12px 35px;
            margin: 15px auto;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            display: block;
            box-shadow: 0 4px 10px rgba(0,172,193,0.3);
        }

        button:hover {
            background: #00838f;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,131,143,0.4);
        }

        .choice-button {
            background: #00838f;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            text-align: right;
            padding: 15px 25px;
            margin: 10px auto;
            color: white;
            font-size: 1.2em;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            border: 3px solid transparent;
            cursor: pointer;
            display: block;
            transition: 0.2s;
        }

        .choice-button:hover {
            background: #006064;
            border-color: #80deea;
            transform: scale(1.01);
        }

        /* تعديل حاوية مدخلات الخانات لتظهر من اليمين إلى اليسار بشكل صحيح هندسياً */
        .fill-blank-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            direction: rtl;
        }

        .number-box-rtl {
            background: #f5f5f5;
            padding: 15px 20px;
            border-radius: 15px;
            border: 3px solid #b2ebf2;
            font-size: 2em;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            direction: rtl; /* الآحاد على اليمين أولاً ثم بقية الأرقام يساراً */
        }

        .number-box-rtl input {
            width: 55px;
            height: 55px;
            font-size: 0.95em;
            text-align: center;
            border: 3px dashed #00acc1;
            border-radius: 10px;
            color: #d32f2f;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            margin-left: 10px; /* مسافة تفصل الآحاد عن العشرات والمئات يسارها */
            outline: none;
            background: white;
            cursor: text;
        }

        .number-box-rtl input:focus {
            border-color: #00838f;
            background: #e0f7fa;
        }

        input[type="text"].normal-input {
            padding: 12px;
            border: 3px solid #b2ebf2;
            border-radius: 12px;
            font-size: 1.4em;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            width: 180px;
            margin: 15px auto;
            display: block;
            color: #006064;
            background: white;
            outline: none;
        }
        
        input[type="text"].normal-input:focus {
            border-color: #00acc1;
        }

        /* لوحة النقاط والتأثيرات البصرية */
        .score-display {
            text-align: center;
            font-size: 1.3em;
            color: #006064;
            margin-top: 20px;
            font-weight: bold;
        }

        .success-flash {
            color: #2e7d32;
            font-weight: bold;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 سر الرقم ٥ السحري: مغامرة قابلية القسمة 🌟</h1>
        <p>الدرس الخامس: قابلية القسمة على ٥ - المنهج التفاعلي المطور</p>
    </header>

    <!-- الشخصية التفاعلية (الثعلب مفكر) -->
    <div class="guide-bubble" id="guideBubble">مرحباً بك يا بطل الرياضيات الذكي! أنا صديقك "مفكر"، دعنا نكتشف اليوم السر المذهل للجدول السحري للرقم ٥! 🦊</div>
    <svg class="character-box" id="characterImage" viewBox="0 0 100 100" onclick="speakAgain()">
        <circle cx="50" cy="50" r="45" fill="#00838f"/>
        <polygon points="50,25 30,55 70,55" fill="#ffb74d" />
        <circle cx="40" cy="48" r="4" fill="#ffffff"/>
        <circle cx="40" cy="48" r="2" fill="#000000"/>
        <circle cx="60" cy="48" r="4" fill="#ffffff"/>
        <circle cx="60" cy="48" r="2" fill="#000000"/>
        <polygon points="50,55 45,62 55,62" fill="#d32f2f"/>
        <path d="M 35 70 Q 50 80 65 70" stroke="#ffffff" stroke-width="4" fill="none"/>
    </svg>

    <div class="game-container" id="mainContainer"></div>

    <script>
        let score = 0;
        let quizIndex = 0;
        let selectedCellsCount = 0; // لحساب الخلايا التي حددها الطالب في الجدول التفاعلي

        // مصفوفة الأرقام الهندية للتحويل التلقائي الكامل
        const easternDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        
        function toEasternArabic(num) {
            if (num === null || num === undefined) return '';
            return num.toString().replace(/\d/g, d => easternDigits[d]);
        }

        // محول الأرقام المدخلة من المستخدم للتوافق مع الإدخالين العربي والإنجليزي
        function parseInputNumber(str) {
            let result = '';
            for (let char of str) {
                let idx = easternDigits.indexOf(char);
                if (idx !== -1) {
                    result += idx;
                } else if (/[0-9]/.test(char)) {
                    result += char;
                }
            }
            return parseInt(result, 10);
        }

        // مصمم أصوات مدمج للتفاعل دون الحاجة لملفات خارجية لضمان عمل اللعبة بنسبة 100% بدون إنترنت
        function playSound(success) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                if (success) {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                }
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) { 
                console.log("Audio block bypass"); 
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.onload = function() {
            stage1_TableObservation();
        };

        // المرحلة ١ المحدثة: جعل الجدول تفاعلياً بالكامل وإصلاح الصياغة العلمية
        function stage1_TableObservation() {
            selectedCellsCount = 0;
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ١: لغز جدول الآحاد المفقود 🔎</div>
                <p style="font-size:1.25em; text-align:center; margin-bottom:15px; font-weight:bold;">
                    اضغط بإصبعك على الأعداد التي تقبل القسمة على <span class="highlight-red">${toEasternArabic(5)}</span> في الصف الأول لتكتشف المفاجأة:
                </p>
                
                <table class="book-table">
                    <tr>
                        <td class="clickable-cell" onclick="toggleCell(this, 40)">${toEasternArabic(40)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 35)">${toEasternArabic(35)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 30)">${toEasternArabic(30)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 25)">${toEasternArabic(25)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 20)">${toEasternArabic(20)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 15)">${toEasternArabic(15)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 10)">${toEasternArabic(10)}</td>
                        <td class="clickable-cell" onclick="toggleCell(this, 5)">${toEasternArabic(5)}</td>
                        <th>÷ ${toEasternArabic(5)}</th>
                    </tr>
                    <tr style="background:#f9f9f9; color:#00838f;">
                        <td>${toEasternArabic(8)}</td>
                        <td>${toEasternArabic(7)}</td>
                        <td>${toEasternArabic(6)}</td>
                        <td>${toEasternArabic(5)}</td>
                        <td>${toEasternArabic(4)}</td>
                        <td>${toEasternArabic(3)}</td>
                        <td>${toEasternArabic(2)}</td>
                        <td>${toEasternArabic(1)}</td>
                        <th>الناتج</th>
                    </tr>
                </table>

                <h4 style="text-align:center; margin-top:20px; color:#006064; font-size:1.3em;">
                    انظر إلى خانة الآحاد (أول رقم يبدأ به العدد من اليمين) للأرقام التي ضغطت عليها.. ما هو الرقم السحري المشترك الذي تتناوب عليه؟
                </h4>
                <p style="text-align:center; font-size:1.1em; color:#00838f; margin-bottom:10px;">إما أن يبدأ آحادها بالرقم <span class="highlight-red">${toEasternArabic(5)}</span> أو ...؟</p>
                
                <input type="text" id="stage1Input" class="normal-input" placeholder="اكتب الرقم هنا">
                <button onclick="checkStage1()">تأكيد الملاحظة 🎯</button>
            `;
            document.getElementById('guideBubble').textContent = "اضغط أولاً على جميع الأعداد في الصف العلوي للجدول لتصفيقها، ثم فكر: رقم الآحاد (أول رقم من اليمين) لكل منها يتناوب بين ٥ وصفر! اكتب صفر (٠) في المربع للتأكيد! 🦊";
        }

        // لتفاعل الضغط الفعلي على خلايا الجدول
        function toggleCell(cell, value) {
            if (!cell.classList.contains('selected-correct')) {
                cell.classList.add('selected-correct');
                playSound(true);
                selectedCellsCount++;
            }
        }

        function checkStage1() {
            const val = document.getElementById('stage1Input').value.trim();
            const parsed = parseInputNumber(val);
            if (parsed === 0) {
                score += 30;
                playSound(true);
                alert("عبقري! نعم، رقم الآحاد (أول رقم من اليمين) يجب أن يبدأ بـ ٥ أو ٠ لكي يقبل القسمة على ٥!");
                stage2_RuleDefinition();
            } else {
                playSound(false);
                alert("تأمل الأرقام التي يبدأ بها كل عدد من اليمين: ٤٠ يبدأ بـ (٠)، ٣٥ يبدأ بـ (٥)، ٣٠ يبدأ بـ (٠)... إذن الرقم الآخر بجانب الـ ٥ هو...؟ اكتب الرقم (٠)");
            }
        }

        // المرحلة ٢: تدوين القاعدة الذهبية
        function stage2_RuleDefinition() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٢: القاعدة الذهبية للدرس 📜</div>
                <div style="background:#e0f2f1; padding:25px; border-radius:20px; border-right:10px solid #00acc1; margin-bottom:25px; box-shadow:inset 0 0 10px rgba(0,0,0,0.05);">
                    <h2 style="color:#00796b; margin-bottom:10px; font-weight:900;">قاعدة الكتاب المدرسي المعتمدة:</h2>
                    <p style="font-size:1.5em; font-weight:bold; line-height:1.9; color:#004d40; text-align:center;">
                        يقبل العدد القسمة على <span class="highlight-red">${toEasternArabic(5)}</span> إذا كان رقم آحاده (أول رقم يبدأ به العدد من اليمين) هو <span style="color:#d32f2f;">${toEasternArabic(5)}</span> أو <span style="color:#d32f2f;">${toEasternArabic(0)}</span>.
                    </p>
                </div>
                
                <h3 style="text-align:center; margin-bottom:20px;">سؤال التحدي السريع: هل يقبل العدد ${toEasternArabic(73)} القسمة على ${toEasternArabic(5)}؟</h3>
                <button class="choice-button" onclick="checkStage2(false)">نعم، يقبل القسمة</button>
                <button class="choice-button" onclick="checkStage2(true)">لا يقبل، لأن خانة آحاده من اليمين ليست ٥ أو ٠</button>
            `;
            document.getElementById('guideBubble').textContent = "تذكر دائماً: الآحاد هي أول خانة نكتبها ونقرأها من اليمين! 🦊";
        }

        function checkStage2(isCorrect) {
            if (isCorrect) {
                score += 35;
                playSound(true);
                alert("رائع جداً! أول رقم من اليمين (الآحاد) في العدد ٧٣ هو ٣، وبما أنه ليس ٥ أو ٠ فهو لا يقبل القسمة على ٥.");
                stage3_TextbookExercise();
            } else {
                playSound(false);
                alert("تذكر يا بطل، آحاد العدد ٧٣ هو الرقم ٣ (أول رقم من اليمين)! وهو ليس ٥ ولا صفراً.");
            }
        }

        // المرحلة ٣ المحدثة: الآحاد على اليمين تماماً والمدخلات مرئية وقابلة للضغط بسهولة
        function stage3_TextbookExercise() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header">المرحلة ٣: تمرين إكمال الخانات المفقودة ✏️</div>
                <p style="font-size:1.3em; text-align:center; margin-bottom:20px; font-weight:bold; line-height:1.8;">
                    اضغط داخل المربع المنقط (خانة الآحاد على اليمين) واكتب الرقم المناسب ليقبل العدد القسمة على <span class="highlight-red">${toEasternArabic(5)}</span>:
                </p>
                
                <div class="fill-blank-container">
                    <!-- تم ترتيب الخانات بحيث يكون المربع الفارغ (الآحاد) في أقصى اليمين، والعدد المكتوب يساره -->
                    <div class="number-box-rtl">
                        <input type="text" id="blank1" maxlength="1" placeholder="؟">
                        <span>١٢</span>
                    </div>
                    
                    <div class="number-box-rtl">
                        <input type="text" id="blank2" maxlength="1" placeholder="؟">
                        <span>٣٨٧</span>
                    </div>
                    
                    <div class="number-box-rtl">
                        <input type="text" id="blank3" maxlength="1" placeholder="؟">
                        <span>٥٣٢</span>
                    </div>
                    
                    <div class="number-box-rtl">
                        <input type="text" id="blank4" maxlength="1" placeholder="؟">
                        <span>٣٢</span>
                    </div>
                </div>

                <p style="text-align:center; font-size:1.1em; color:#00796b;">(يمكنك وضع الرقم ٥ أو الرقم ٠ في أي خانة لتجعلها صحيحة!)</p>
                <button onclick="checkStage3()" style="margin-top:25px;">تأكيد الإجابات وتدقيقها ✔️</button>
            `;
            document.getElementById('guideBubble').textContent = "الآن المربعات واضحة، تفاعلية وقابلة للكتابة بيسر! أدخل ٥ أو ٠ في المربعات التي تقع في أقصى يمين كل رقم! 🦊";
        }

        function checkStage3() {
            const b1 = parseInputNumber(document.getElementById('blank1').value.trim());
            const b2 = parseInputNumber(document.getElementById('blank2').value.trim());
            const b3 = parseInputNumber(document.getElementById('blank3').value.trim());
            const b4 = parseInputNumber(document.getElementById('blank4').value.trim());

            const checkSingle = (val) => (val === 5 || val === 0);

            if (checkSingle(b1) && checkSingle(b2) && checkSingle(b3) && checkSingle(b4)) {
                score += 45;
                playSound(true);
                alert("عبقري مذهل! لقد ملأت خانات الآحاد من اليمين بشكل ممتاز وأصبحت الأرقام كلها تقبل القسمة!");
                stage4_IntroToBigQuiz();
            } else {
                playSound(false);
                alert("تأكد من ملء كل المربعات بالرقم ٥ أو الرقم ٠ فقط لتكون الإجابة صحيحة ومقبولة!");
            }
        }

        // المرحلة ٤: مدخل التحدي الشامل لـ ١٥ سؤالاً مبعثراً عشوائياً
        function stage4_IntroToBigQuiz() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="stage-header" style="background:#00838f;">المرحلة الرابعة: تحدي فرسان الأرقام الـ ١٥ الكبير 🚀</div>
                <h2 style="text-align:center; margin:25px 0; color:#004d40;">أداء أسطوري لا غبار عليه!</h2>
                <p style="font-size:1.4em; text-align:center; margin-bottom:30px; line-height:1.8;">
                    سوف تواجه الآن جهاز اختبار ذكي يقوم بسحب <span style="color:#d32f2f; font-weight:bold;">${toEasternArabic(15)} سؤالاً مبعثراً عشوائياً</span><br>
                    مستوحاة بالكامل من أمثلة الكتاب، اختبارات قابلية القسمة، والتمارين الصعبة!
                </p>
                <button onclick="startFinalQuiz()" style="font-size:1.3em; padding:15px 50px; border-radius:50px;">ابتدئ التحدي الكبير 🦊🔥</button>
            `;
            document.getElementById('guideBubble').textContent = "أنت ذكي ومستعد تماماً، دعنا نثبت للجميع تفوقك في تحدي قابلية القسمة على ٥! 🦊";
        }

        // بنك الـ ١٥ سؤالاً الشامل والمطابق للدرس الخامس والمنهج
        const quizDatabase = [
            { q: "أي من الأعداد الآتية يقبل القسمة على ٥ وفقاً لمثال الدرس؟", choices: ["٣٥", "٣٢", "٤٣"], correct: "٣٥" },
            { q: "ما هو رقم الآحاد (أول رقم من اليمين) الذي يجب أن يبدأ به أي عدد ليقبل القسمة على ٥؟", choices: ["٥ أو ٠", "٥ أو ٣", "٢ أو ٥"], correct: "٥ أو ٠" },
            { q: "هل يقبل العدد ٤٠ القسمة على ٥؟", choices: ["نعم، لأن آحاده تبدأ بـ ٠", "لا، لأن آحاده ليس ٥", "يقبل القسمة فقط إذا ضربناه بـ ٢"], correct: "نعم، لأن آحاده تبدأ بـ ٠" },
            { q: "لماذا لا يقبل العدد ٦٨ القسمة على ٥؟", choices: ["لأن آحاده (أول رقم من اليمين) ليس ٥ أو ٠", "لأن آحاده عدد فردي", "لأن العشرات فيه هي ٦"], correct: "لأن آحاده (أول رقم من اليمين) ليس ٥ أو ٠" },
            { q: "إذا وضعنا الرقم ٥ في خانة آحاد العدد _٣٢ ليصبح ٣٢٥، فهل يقبل القسمة على ٥؟", choices: ["نعم بكل تأكيد", "لا، الخانات الأخرى تمنعه", "يقبل القسمة على ٣ فقط"], correct: "نعم بكل تأكيد" },
            { q: "أي من الأعداد الآتية لا يقبل القسمة على ٥ مطلقاً؟", choices: ["٣٧", "٥٥", "٤٠"], correct: "٣٧" },
            { q: "من تمرين الكتاب: الأعداد ٣٢، ٤٣، ٩٩ لا تقبل القسمة على ٥ لأن رقم آحادها (أول رقم من اليمين):", choices: ["ليس ٥ أو ٠", "أكبر من ٥", "أعداد زوجية فقط"], correct: "ليس ٥ أو ٠" },
            { q: "إذا كان لدينا العدد ٥٣٢_ وأردنا أن نجعله يقبل القسمة على ٥، فماذا نضع في الآحاد؟", choices: ["٠ أو ٥", "٣ فقط", "٢ فقط"], correct: "٠ أو ٥" },
            { q: "ما هو ناتج قسمة ٤٠ ÷ ٥ كما جاء في جدول الدرس؟", choices: ["٨", "٧", "٦"], correct: "٨" },
            { q: "ما هو ناتج قسمة ٢٥ ÷ ٥؟", choices: ["٥", "٦", "٤"], correct: "٥" },
            { q: "أي من هذه الأرقام إذا بدأ به أي عدد من اليمين يجعله فوراً يقبل القسمة على ٥؟", choices: ["٠", "٢", "٨"], correct: "٠" },
            { q: "العدد ٥٥ يقبل القسمة على ٥ لأن رقم آحاده هو:", choices: ["٥", "٠", "العشرات ٥"], correct: "٥" },
            { q: "أي الأعداد التالية ناتج قسمته على ٥ يعطي ٧؟", choices: ["٣٥", "٣٠", "٤٠"], correct: "٣٥" },
            { q: "هل يقبل العدد ٩٩ القسمة على ٥؟", choices: ["لا، لأن أول رقم من اليمين ليس ٥ أو ٠", "نعم، لأن العشرات ٩", "يقبل في بعض الحالات"], correct: "لا، لأن أول رقم من اليمين ليس ٥ أو ٠" },
            { q: "ما هو ناتج قسمة ١٠ ÷ ٥؟", choices: ["٢", "١", "٣"], correct: "٢" }
        ];

        function startFinalQuiz() {
            quizIndex = 0;
            shuffleArray(quizDatabase);
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const container = document.getElementById('mainContainer');
            if (quizIndex < quizDatabase.length) {
                const currentQ = quizDatabase[quizIndex];
                const shuffledChoices = shuffleArray([...currentQ.choices]);

                container.innerHTML = `
                    <div class="stage-header" style="background:#00838f;">التحدي الكبير: سؤال (${toEasternArabic(quizIndex + 1)} من ${toEasternArabic(quizDatabase.length)})</div>
                    <p style="text-align:center; font-size:1.5em; margin:25px; font-weight:bold; color:#004d40; line-height:1.6;">${currentQ.q}</p>
                    
                    <div id="choicesBlock">
                        ${shuffledChoices.map(choice => `
                            <button class="choice-button" onclick="submitAnswer('${choice.replace(/'/g, "\\'")}')">${choice}</button>
                        `).join('')}
                    </div>
                    
                    <div class="score-display">نقاطك الذهبية الحالية: <span class="success-flash">${toEasternArabic(score)}</span></div>
                `;
                document.getElementById('guideBubble').textContent = `السؤال رقم ${toEasternArabic(quizIndex + 1)} في انتظارك! ركّز على أول رقم من اليمين! 🦊`;
            } else {
                renderVictoryScreen();
            }
        }

        function submitAnswer(selected) {
            const currentQ = quizDatabase[quizIndex];
            if (selected === currentQ.correct) {
                score += 30;
                playSound(true);
                alert("✅ جواب رائع وصحيح تماماً! استمر في هذا الإبداع!");
            } else {
                playSound(false);
                alert(`❌ انتبه يا بطل! الإجابة الصحيحة والدقيقة هي: ${currentQ.correct}`);
            }
            quizIndex++;
            renderQuizQuestion();
        }

        function renderVictoryScreen() {
            const container = document.getElementById('mainContainer');
            const starsCount = Math.min(5, Math.max(1, Math.floor(score / 90)));
            
            container.innerHTML = `
                <div style="text-align:center; padding:45px 20px; background:linear-gradient(#e0f2f1, #ffffff); border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 4px solid #00acc1;">
                    <h1 style="color:#00796b; font-size:2.6em; margin-bottom:15px; font-weight:900;">🏆 وسام الإتقان المطلق للرقم ٥! 🏆</h1>
                    <p style="font-size:1.4em; margin:20px 0; line-height:1.8; color:#004d40;">
                        ألف مبروك يا بطل الأرقام الأسطوري! لقد نجحت في تفكيك واجتياز اختبار درس (قابلية القسمة على ٥) بالكامل ووفقاً لتمارين كتابك بنجاح باهر!
                    </p>
                    <div style="font-size:4em; margin:20px; letter-spacing:8px;">${'⭐'.repeat(starsCount)}</div>
                    <h2 style="color:#004d40; font-size:1.8em; margin-bottom:25px;">مجموع نقاطك النهائية الفاخرة: <strong>${toEasternArabic(score)} نقطة</strong></h2>
                    
                    <button onclick="location.reload()" style="background:#00838f; font-size:1.3em; padding:15px 45px; border-radius:50px;">
                        خوض المغامرة من جديد 🔄
                    </button>
                </div>
            `;
            playSound(true);
            document.getElementById('guideBubble').textContent = "إنجاز فريد وعظيم للغاية! لقد أصبحت رسمياً خبيراً في قابلية القسمة على الرقم ٥! 🦊🏆";
        }

        function speakAgain() {
            const currentBubble = document.getElementById('guideBubble').textContent;
            alert("مفكر الذكي يقول لك: \n" + currentBubble);
        }
    </script>
</body>
</html>
