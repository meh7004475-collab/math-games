<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأعداد الزوجية والفردية - الصف الرابع</title>
<style>
:root {
  --blue: #1565C0; --blue-l: #E3F2FD; --blue-d: #0D47A1;
  --green: #2E7D32; --green-l: #E8F5E9;
  --red: #C62828; --red-l: #FFEBEE;
  --orange: #E65100; --orange-l: #FFF3E0;
  --purple: #6A1B9A; --purple-l: #F3E5F5;
  --teal: #00695C; --teal-l: #E0F2F1;
  --gold: #F9A825;
  --shadow: 0 4px 18px rgba(21,101,192,.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI','Arial',sans-serif;
  background: linear-gradient(135deg,#E3F2FD 0%,#F3E5F5 55%,#E8F5E9 100%);
  min-height: 100vh; color: #1A237E; direction: rtl;
}
.hdr {
  background: linear-gradient(135deg,#0D47A1,#1565C0);
  color: white; padding: 12px 18px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 3px 12px rgba(13,71,161,.35);
  position: sticky; top: 0; z-index: 100;
}
.hdr-title { font-size: 1.1rem; font-weight: 900; }
.score-box {
  background: var(--gold); color: #0D47A1;
  border-radius: 20px; padding: 5px 14px;
  font-weight: 900; font-size: 1rem;
  display: flex; align-items: center; gap: 5px; transition: transform .2s;
}
.prog-wrap { padding: 9px 17px 0; }
.prog-label { font-size: .8rem; color: #555; font-weight: 700; margin-bottom: 3px; }
.prog-bar { background: #BBDEFB; border-radius: 10px; height: 12px; overflow: hidden; }
.prog-fill { background: linear-gradient(90deg,#42A5F5,#0D47A1); height: 100%; border-radius: 10px; transition: width .5s; }
.gmain { max-width: 700px; margin: 0 auto; padding: 13px; }
.card {
  background: white; border-radius: 22px; padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 13px;
  border: 3px solid #BBDEFB; animation: slideIn .4s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
.badge {
  display: inline-block;
  background: linear-gradient(135deg,#0D47A1,#1565C0);
  color: white; border-radius: 20px; padding: 4px 13px;
  font-size: .77rem; font-weight: 700; margin-bottom: 8px;
}
.ctitle { font-size: 1.2rem; font-weight: 900; color: #0D47A1; margin-bottom: 8px; }
.mascot-row {
  display: flex; align-items: flex-start; gap: 10px;
  background: #FFF8E1; border-radius: 14px;
  padding: 10px 14px; margin-bottom: 13px; border: 2px solid var(--gold);
}
.mascot-svg { flex-shrink: 0; width: 52px; }
.mascot-txt { font-size: .9rem; line-height: 1.7; font-weight: 600; color: #4E342E; }

/* TABLES */
.ptable { width: 100%; border-collapse: collapse; margin: 11px 0; direction: rtl; }
.ptable th { background: #0D47A1; color: white; padding: 8px 5px; font-size: .78rem; font-weight: 800; text-align: center; border: 2px solid #0A3880; }
.ptable td { border: 2px solid #BBDEFB; padding: 9px 5px; text-align: center; font-size: 1.15rem; font-weight: 900; }
.ptable tr:nth-child(odd) td { background: #E3F2FD; }
.ptable tr:nth-child(even) td { background: #F5F9FF; }
.hl { background: #FFF176 !important; color: #E65100 !important; }

/* BUTTONS */
.btn { border: none; border-radius: 12px; font-family: inherit; font-weight: 800; font-size: .93rem; cursor: pointer; padding: 10px 18px; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
.btn:active { transform: scale(.95); }
.btn-primary { background: linear-gradient(135deg,#0D47A1,#1565C0); color:white; box-shadow:0 4px 12px rgba(13,71,161,.28); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-green { background: linear-gradient(135deg,#2E7D32,#1B5E20); color:white; }
.btn-orange { background: linear-gradient(135deg,#E65100,#BF360C); color:white; }
.btn-teal { background: linear-gradient(135deg,#00695C,#004D40); color:white; }
.btn-choice {
  display: block; width: 100%; background: #E3F2FD; color: #0D47A1;
  border: 2.5px solid #90CAF9; border-radius: 12px; padding: 10px 14px;
  font-size: .9rem; font-weight: 700; cursor: pointer; text-align: right;
  margin-bottom: 8px; transition: all .2s;
}
.btn-choice:hover { background: #BBDEFB; }
.btn-choice.correct { background: #E8F5E9; border-color: #2E7D32; color: #1B5E20; }
.btn-choice.wrong { background: #FFEBEE; border-color: #C62828; color: #C62828; }

/* FEEDBACK */
.fb { border-radius: 14px; padding: 12px 16px; font-size: .93rem; font-weight: 700; text-align: center; margin-top: 12px; display: none; animation: pop .4s ease; }
@keyframes pop { 0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;} }
.fb.ok { background: #E8F5E9; border: 2px solid #2E7D32; color: #1B5E20; display: block; }
.fb.err { background: #FFEBEE; border: 2px solid #C62828; color: #C62828; display: block; }

/* NUMBER CHIPS */
.num-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
.num-chip {
  border-radius: 12px; padding: 9px 15px; font-size: 1.1rem; font-weight: 900;
  cursor: pointer; border: 2.5px solid; transition: all .2s; user-select: none;
}
.num-chip.neutral { background: #F5F5F5; border-color: #BDBDBD; color: #333; }
.num-chip.even { background: var(--blue-l); border-color: var(--blue); color: var(--blue-d); }
.num-chip.odd { background: var(--orange-l); border-color: var(--orange); color: var(--orange); }
.num-chip.prime { background: var(--green-l); border-color: var(--green); color: var(--green); }
.num-chip.composite { background: var(--red-l); border-color: var(--red); color: var(--red); }
.num-chip.selected { transform: scale(1.12); box-shadow: 0 4px 12px rgba(0,0,0,.2); }

/* CLASSIFY ZONES */
.classify-area { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.zone { border-radius: 14px; padding: 12px; min-height: 80px; border: 3px dashed; }
.zone-even { background: var(--blue-l); border-color: var(--blue); }
.zone-odd { background: var(--orange-l); border-color: var(--orange); }
.zone-prime { background: var(--green-l); border-color: var(--green); }
.zone-composite { background: var(--red-l); border-color: var(--red); }
.zone-title { font-weight: 900; font-size: .9rem; margin-bottom: 8px; text-align: center; }
.zone-even .zone-title { color: var(--blue-d); }
.zone-odd .zone-title { color: var(--orange); }
.zone-prime .zone-title { color: var(--green); }
.zone-composite .zone-title { color: var(--red); }
.dropped { display: inline-block; background: white; border-radius: 8px; padding: 5px 10px; margin: 3px; font-weight: 900; font-size: .95rem; box-shadow: 0 2px 5px rgba(0,0,0,.1); }

/* LIST TABLE */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0; }
.list-box { background: #F8F9FA; border-radius: 12px; padding: 12px; border: 2px solid #E0E0E0; }
.list-box-title { font-weight: 800; font-size: .88rem; text-align: center; margin-bottom: 10px; }
.list-item { display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; padding: 5px; border-radius: 8px; margin-bottom: 4px; }
.list-item.even-item { background: var(--blue-l); color: var(--blue-d); }
.list-item.odd-item { background: var(--orange-l); color: var(--orange); }

/* ADDITION TABLE */
.add-table { width: 100%; border-collapse: collapse; margin: 12px 0; direction: rtl; }
.add-table th { background: #0D47A1; color: white; padding: 10px 6px; text-align: center; font-size: 1rem; font-weight: 900; border: 2px solid #0A3880; }
.add-table td { border: 2px solid #BBDEFB; padding: 6px 4px; text-align: center; }
.add-input {
  width: 58px; border: 2.5px solid #90CAF9; border-radius: 8px;
  padding: 5px 3px; font-size: 1rem; font-weight: 900;
  text-align: center; font-family: inherit; color: #0D47A1;
  outline: none; background: #F5F9FF;
}
.add-input.ok { border-color: #2E7D32; background: #E8F5E9; color: #1B5E20; }
.add-input.err { border-color: #C62828; background: #FFEBEE; color: #C62828; }

/* ABACUS */
.abacus-wrap { display: flex; gap: 5px; justify-content: center; align-items: flex-end; margin: 14px auto; direction: ltr; overflow-x: auto; padding: 6px; }
.ab-col { display: flex; flex-direction: column; align-items: center; }
.ab-lbl { font-size: .6rem; font-weight: 800; color: #0D47A1; margin-bottom: 5px; text-align: center; max-width: 36px; }
.ab-beads { display: flex; flex-direction: column; gap: 3px; align-items: center; min-height: 130px; justify-content: flex-end; }
.ab-bead { width: 24px; height: 12px; border-radius: 6px; background: linear-gradient(135deg,#42A5F5,#1565C0); border: 2px solid #0D47A1; cursor: pointer; transition: all .15s; }
.ab-bead.lit { background: linear-gradient(135deg,#FF7043,#D84315); border-color: #8F2400; }
.ab-rod { width: 5px; height: 16px; background: linear-gradient(#8D6E63,#5D4037); border-radius: 3px; }
.ab-base { width: 30px; height: 10px; background: linear-gradient(#26A69A,#00796B); border-radius: 4px; margin-top: 4px; }
.ab-val { font-size: .85rem; font-weight: 900; color: #0D47A1; margin-top: 4px; }

/* DRAG */
.drag-num { background: linear-gradient(135deg,#E3F2FD,#BBDEFB); border: 2.5px solid #1565C0; border-radius: 12px; padding: 9px 15px; font-size: 1.2rem; font-weight: 900; cursor: grab; user-select: none; transition: all .18s; color: #0D47A1; }
.drag-num:hover { transform: scale(1.07); }
.drag-num.used { opacity: .3; pointer-events: none; }

/* CELEBRATION */
.celeb { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 999; }
.celeb.show { display: flex; }
.celeb-box { background: white; border-radius: 24px; padding: 28px; text-align: center; max-width: 350px; width: 90%; animation: zoomIn .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes zoomIn { from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;} }
.celeb-stars { font-size: 2.2rem; margin: 7px 0; }
.celeb-title { font-size: 1.45rem; font-weight: 900; color: #0D47A1; margin-bottom: 6px; }
.celeb-msg { font-size: .92rem; color: #555; margin-bottom: 16px; line-height: 1.6; }
.cf { position:fixed;width:11px;height:11px;opacity:0;animation:fall 3s ease-in forwards;border-radius:2px;z-index:1000; }
@keyframes fall { 0%{opacity:1;transform:translateY(-80px)rotateZ(0);}100%{opacity:0;transform:translateY(100vh)rotateZ(720deg);} }

.intro { text-align: center; padding: 16px 8px; }
.intro-title { font-size: 1.8rem; font-weight: 900; color: #0D47A1; margin-bottom: 8px; }
.intro-sub { font-size: .93rem; color: #555; margin-bottom: 16px; line-height: 1.8; }
.intro-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 8px; margin-bottom: 16px; }
.intro-item { background: linear-gradient(135deg,#E3F2FD,#BBDEFB); border: 2px solid #1565C0; border-radius: 12px; padding: 10px 6px; font-size: .8rem; font-weight: 700; color: #0D47A1; text-align: center; }
.intro-icon { font-size: 1.4rem; margin-bottom: 3px; }

@media(max-width:480px) {
  .classify-area{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .ctitle{font-size:1rem;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">🔢 الأعداد الزوجية والفردية</div>
  <div class="score-box" id="scoreBox">⭐ <span id="scoreDisp">٠</span></div>
</div>
<div class="prog-wrap">
  <div class="prog-label">التقدم: <span id="progLbl">لم تبدأ بعد</span></div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="gmain" id="gmain"></div>

<div class="celeb" id="celebWrap">
  <div class="celeb-box">
    <div class="celeb-stars">⭐⭐⭐</div>
    <div class="celeb-title" id="cTitle">رائع!</div>
    <div class="celeb-msg" id="cMsg"></div>
    <button class="btn btn-green" onclick="nextStage()">التالي ←</button>
  </div>
</div>

<script>
var stage = -1, score = 0, TOTAL = 12;
function ar(n){ return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];}); }
function updProg(){
  var pct = stage<0?0:Math.round(stage/TOTAL*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLbl').textContent=stage<0?'لم تبدأ بعد':'المرحلة '+ar(stage)+' من '+ar(TOTAL);
  document.getElementById('scoreDisp').textContent=ar(score);
}
function addScore(n){
  score+=n;
  document.getElementById('scoreDisp').textContent=ar(score);
  var b=document.getElementById('scoreBox');
  b.style.transform='scale(1.25)';
  setTimeout(function(){b.style.transform='scale(1)';},280);
}
function snd(t){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(t==='ok'){o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.12);o.frequency.setValueAtTime(784,ctx.currentTime+.24);g.gain.setValueAtTime(.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.55);o.start();o.stop(ctx.currentTime+.55);}
    else{o.type='sawtooth';o.frequency.setValueAtTime(180,ctx.currentTime);g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);o.start();o.stop(ctx.currentTime+.28);}
  }catch(e){}
}
function cfetti(){
  var cols=['#1565C0','#2E7D32','#E65100','#6A1B9A','#F9A825','#C62828'];
  for(var i=0;i<50;i++){var el=document.createElement('div');el.className='cf';el.style.cssText='left:'+(Math.random()*100)+'vw;top:0;background:'+cols[Math.floor(Math.random()*cols.length)]+';animation-delay:'+(Math.random()*.8)+'s;animation-duration:'+(2+Math.random()*2)+'s;';document.body.appendChild(el);setTimeout(function(){el.remove();},4500);}
}
function celeb(title,msg){
  document.getElementById('cTitle').textContent=title;
  document.getElementById('cMsg').textContent=msg;
  document.getElementById('celebWrap').classList.add('show');
  cfetti();snd('ok');
}
function nextStage(){
  document.getElementById('celebWrap').classList.remove('show');
  stage++;updProg();render();
}
function render(){
  document.getElementById('gmain').innerHTML='';
  var fns=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,sFinal];
  if(stage<0){renderIntro();return;}
  if(stage<fns.length)fns[stage]();
  else sFinal();
}
function html(h){document.getElementById('gmain').innerHTML='<div class="card">'+h+'</div>';}
function ms(){return '<svg class="mascot-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="22" r="18" fill="#FFB300"/><circle cx="22" cy="18" r="3" fill="#1A237E"/><circle cx="38" cy="18" r="3" fill="#1A237E"/><circle cx="23" cy="17" r="1.2" fill="white"/><circle cx="39" cy="17" r="1.2" fill="white"/><path d="M22 28 Q30 35 38 28" stroke="#1A237E" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="18" cy="22" rx="4" ry="3" fill="#F57F17" opacity=".7"/><ellipse cx="42" cy="22" rx="4" ry="3" fill="#F57F17" opacity=".7"/><path d="M20 40 Q30 44 40 40 L38 55 Q30 58 22 55 Z" fill="#1565C0"/><circle cx="30" cy="6" r="4" fill="#66BB6A"/></svg>';}
function isPrime(n){if(n<2)return false;for(var i=2;i<=Math.sqrt(n);i++)if(n%i===0)return false;return true;}
function isEven(n){return n%2===0;}

// ── INTRO ──────────────────────────────────────
function renderIntro(){
  stage=-1;
  html('<div class="intro"><div style="font-size:2.6rem;margin-bottom:8px;">🔢</div><div class="intro-title">الأعداد الزوجية والفردية</div><div class="intro-sub">مرحباً! في هذا الدرس ستتعلم الفرق بين الأعداد الزوجية والفردية وتُطبّق على تمارين متنوعة! 🎉</div><div class="intro-grid"><div class="intro-item"><div class="intro-icon">🔍</div>نشاط: القائمة أ</div><div class="intro-item"><div class="intro-icon">🔍</div>نشاط: القائمة ب</div><div class="intro-item"><div class="intro-icon">📏</div>القاعدة</div><div class="intro-item"><div class="intro-icon">🎯</div>المثال ١٤ عدداً</div><div class="intro-item"><div class="intro-icon">🎮</div>تمرين/١ زوجية</div><div class="intro-item"><div class="intro-icon">🎲</div>تمرين/٢ فردية</div><div class="intro-item"><div class="intro-icon">📊</div>تمرين/٣ الجدول</div><div class="intro-item"><div class="intro-icon">💡</div>الاستنتاجات</div><div class="intro-item"><div class="intro-icon">🧮</div>تمرين عام/١</div><div class="intro-item"><div class="intro-icon">⚖️</div>تمرين عام/٢+٣</div><div class="intro-item"><div class="intro-icon">🌟</div>تمرين عام/٤+٥+٦</div><div class="intro-item"><div class="intro-icon">🏆</div>تمرين عام/٧ + تحدي</div></div><button class="btn btn-primary" onclick="stage=0;updProg();render();">🚀 ابدأ!</button></div>');
}

// ══════════════════════════════════════════════
// S0 — نشاط استكشافي: القائمة أ (الأعداد الزوجية)
// ══════════════════════════════════════════════
function s0(){
  html(
    '<div class="badge">🔍 نشاط استكشافي — القائمة أ</div>'+
    '<div class="ctitle">اكتشف الأعداد الزوجية</div>'+
    '<div class="mascot-row">'+ms()+'<div class="mascot-txt">انظر إلى القائمة (أ)! كل عدد هو مجموع عددين <strong>متساويين</strong>.<br>هل يمكنك اكتشاف القاعدة؟ 🤔</div></div>'+

    '<div class="two-col">'+
    '<div class="list-box"><div class="list-box-title" style="color:#1565C0;">📋 القائمة أ</div>'+
    '<div class="list-item even-item">١ + ١ = ٢</div>'+
    '<div class="list-item even-item">٢ + ٢ = ٤</div>'+
    '<div class="list-item even-item">٣ + ٣ = ٦</div>'+
    '<div class="list-item even-item">٤ + ٤ = ٨</div>'+
    '<div class="list-item even-item">٥ + ٥ = ١٠</div>'+
    '<div class="list-item even-item">٦ + ٦ = ١٢</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;justify-content:center;gap:10px;">'+
    '<div style="background:#E3F2FD;border-radius:12px;padding:12px;font-size:.88rem;line-height:1.7;font-weight:600;color:#0D47A1;border:2px solid #90CAF9;">'+
    '✨ كل عدد في القائمة (أ) يمكن تقسيمه إلى <strong>عددين متساويين</strong>.<br>هذه الأعداد تُسمى <strong>الأعداد الزوجية</strong>!'+
    '</div>'+
    '</div></div>'+

    '<div style="background:#FFF8E1;border-radius:13px;padding:13px;border:2px solid #F9A825;margin-top:12px;">'+
    '<div style="font-weight:800;margin-bottom:9px;color:#4E342E;">🎯 أيّ العبارات صحيحة عن الأعداد الزوجية؟</div>'+
    '<button class="btn-choice" onclick="pick0(0)">أ) لا يمكن تقسيمها إلى عددين متساويين</button>'+
    '<button class="btn-choice" onclick="pick0(1)">ب) يمكن تقسيمها إلى عددين متساويين ✅</button>'+
    '<button class="btn-choice" onclick="pick0(2)">ج) تنتهي دائماً بالرقم ١</button>'+
    '</div>'+
    '<div class="fb" id="fb0"></div>'
  );
}
function pick0(idx){
  var fb=document.getElementById('fb0');
  var btns=document.querySelectorAll('#gmain .btn-choice');
  btns.forEach(function(b){b.disabled=true;});
  if(idx===1){btns[1].className='btn-choice correct';fb.className='fb ok';fb.innerHTML='✅ صحيح! الأعداد الزوجية تُقسَّم إلى عددين متساويين مثل ٦=٣+٣';addScore(10);snd('ok');setTimeout(function(){celeb('🔍 اكتشفت الأعداد الزوجية!','يمكن تقسيمها إلى عددين متساويين!');},1100);}
  else{btns[idx].className='btn-choice wrong';fb.className='fb err';fb.innerHTML='❌ انظر إلى القائمة! كل عدد = عدد + نفس العدد. إذن يمكن تقسيمها!';snd('err');btns.forEach(function(b){b.disabled=false;});btns[idx].disabled=true;}
}

// ══════════════════════════════════════════════
// S1 — نشاط استكشافي: القائمة ب (الأعداد الفردية)
// ══════════════════════════════════════════════
function s1(){
  html(

// S3 — المثال: تمييز ١٤ عدداً بالسحب والإفلات
// ══════════════════════════════════════════════
var exNums3=[2,3,5,8,9,10,12,13,17,20,24,25,32,37];
var classified3={even:[],odd:[]};
var draggedNum3=null;

function s3(){
  classified3={even:[],odd:[]};
  draggedNum3=null;
  renderS3();
}
function renderS3(){
  var poolHTML='<div class="num-pool" id="pool3">';
  exNums3.forEach(function(n){
    var used=classified3.even.indexOf(n)!==-1||classified3.odd.indexOf(n)!==-1;
    poolHTML+='<div class="num-chip neutral'+(used?' used':'')+'" id="nc'+n+'" draggable="true" ondragstart="ds3(event,'+n+')" ontouchstart="ts3(event,'+n+')" ontouchmove="tm3(event)" ontouchend="te3(event)">'+ar(n)+'</div>';
  });
  poolHTML+='</div>';

  var evenDrops=classified3.even.map(function(n){return '<span class="dropped">'+ar(n)+'</span>';}).join('');
  var oddDrops=classified3.odd.map(function(n){return '<span class="dropped">'+ar(n)+'</span>';}).join('');

  document.getElementById('gmain').innerHTML=
    '<div class="card">'+
    '<div class="badge">🎯 المثال: تمييز ١٤ عدداً</div>'+
    '<div class="ctitle">صنّف الأعداد: زوجية أم فردية؟</div>'+
    '<div class="mascot-row">'+ms()+'<div class="mascot-txt">اسحب كل عدد إلى المنطقة الصحيحة!<br>🔵 زوجي = رقم الآحاد: ٠،٢،٤،٦،٨<br>🟠 فردي = رقم الآحاد: ١،٣،٥،٧،٩</div></div>'+
    poolHTML+
    '<div class="classify-area">'+
    '<div class="zone zone-even" id="zone3even" ondragover="event.preventDefault()" ondrop="drop3(event,\'even\')"><div class="zone-title">🔵 أعداد زوجية</div><div id="even3Drop">'+evenDrops+'</div></div>'+
    '<div class="zone zone-odd" id="zone3odd" ondragover="event.preventDefault()" ondrop="drop3(event,\'odd\')"><div class="zone-title">🟠 أعداد فردية</div><div id="odd3Drop">'+oddDrops+'</div></div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:12px;">'+
    '<button class="btn btn-green" onclick="checkS3()">✅ تحقق</button>'+
    '</div>'+
    '<div class="fb" id="fb3"></div>'+
    '</div>';
}
function ds3(e,n){draggedNum3=n;e.dataTransfer.effectAllowed='move';}
function drop3(e,zone){e.preventDefault();if(draggedNum3===null)return;placeNum3(draggedNum3,zone);draggedNum3=null;}
function ts3(e,n){draggedNum3=n;}
function tm3(e){e.preventDefault();}
function te3(e){
  if(draggedNum3===null)return;
  var touch=e.changedTouches[0];
  var el=document.elementFromPoint(touch.clientX,touch.clientY);
  if(!el)return;
  var zone=el.closest('#zone3even')?'even':el.closest('#zone3odd')?'odd':null;
  if(zone){placeNum3(draggedNum3,zone);}
  draggedNum3=null;
}
function placeNum3(n,zone){
  classified3.even=classified3.even.filter(function(x){return x!==n;});
  classified3.odd=classified3.odd.filter(function(x){return x!==n;});
  classified3[zone].push(n);
  renderS3();
}
function checkS3(){
  var fb=document.getElementById('fb3');
  var total=classified3.even.length+classified3.odd.length;
  if(total<exNums3.length){fb.className='fb err';fb.innerHTML='⚠️ لم تصنّف جميع الأعداد! تبقّى '+ar(exNums3.length-total)+' أعداد.';return;}
  var wrong=[];
  classified3.even.forEach(function(n){if(!isEven(n))wrong.push(ar(n)+' (فردي وليس زوجياً)');});
  classified3.odd.forEach(function(n){if(isEven(n))wrong.push(ar(n)+' (زوجي وليس فردياً)');});
  if(wrong.length===0){
    fb.className='fb ok';
    fb.innerHTML='✅ ممتاز! الزوجية: '+classified3.even.map(ar).join('، ')+' — الفردية: '+classified3.odd.map(ar).join('، ');
    addScore(20);snd('ok');
    setTimeout(function(){celeb('🎯 رائع!','صنّفت جميع الأعداد بشكل صحيح!');},1100);
  }else{
    fb.className='fb err';fb.innerHTML='❌ راجع: '+wrong.join(' | ')+'. تذكّر: انظر لرقم الآحاد!';snd('err');
  }
}

// S6 — تمرين /٣: الجدول التفاعلي
// ══════════════════════════════════════════════
// Table: cols=2,5,8,11 rows=3,6,7,12
var tCols=[2,5,8,11], tRows=[3,6,7,12];
var tInputs={};

function s6(){
  tInputs={};
  renderS6();
}
function renderS6(){
  var tableHTML='<table class="add-table"><tr><th>+</th>';
  tCols.forEach(function(c){tableHTML+='<th>'+ar(c)+'</th>';});
  tableHTML+='</tr>';
  tRows.forEach(function(r){
    tableHTML+='<tr><th>'+ar(r)+'</th>';
    tCols.forEach(function(c){
      var key=r+'_'+c;
      var val=tInputs[key]||'';
      var cls=val?((parseInt(val)===(r+c))?'ok':'err'):'';
      tableHTML+='<td><input class="add-input '+cls+'" id="ti'+key+'" type="number" value="'+val+'" placeholder="؟" onchange="setTInput(\''+key+'\',this.value,'+r+','+c+')"></td>';
    });
    tableHTML+='</tr>';
  });
  tableHTML+='</table>';

  document.getElementById('gmain').innerHTML=
    '<div class="card">'+
    '<div class="badge">📊 تمرين (٦)/٣</div>'+
    '<div class="ctitle">أكمل جدول الجمع</div>'+
    '<div class="mascot-row">'+ms()+'<div class="mascot-txt">أكمل الجدول! اجمع الرقم في العمود مع الرقم في الصف ✏️<br>مثال: ٢ + ٣ = ٥</div></div>'+
    tableHTML+
    '<div style="text-align:center;margin-top:12px;">'+
    '<button class="btn btn-primary" onclick="checkS6()">✅ تحقق</button>'+
    '</div>'+
    '<div class="fb" id="fb6"></div>'+
    '</div>';
}
function setTInput(key,val,r,c){
  tInputs[key]=val;
  var el=document.getElementById('ti'+key);
  if(val===''){el.className='add-input';return;}
  el.className='add-input '+(parseInt(val)===(r+c)?'ok':'err');
}
function checkS6(){
  var fb=document.getElementById('fb6');
  var wrong=0,total=0;
  tRows.forEach(function(r){
    tCols.forEach(function(c){
      total++;
      var key=r+'_'+c;
      if(!tInputs[key]||parseInt(tInputs[key])!==(r+c))wrong++;
    });
  });
  if(wrong===0){
    fb.className='fb ok';fb.innerHTML='✅ جميع خلايا الجدول صحيحة! رائع!';
    addScore(20);snd('ok');
    setTimeout(function(){celeb('📊 أكملت الجدول!','الآن نستنتج القواعد!');},1100);
  }else{
    fb.className='fb err';fb.innerHTML='❌ يوجد '+ar(wrong)+' خطأ. الخلايا الحمراء تحتاج تصحيح!';snd('err');
  }
}

    '<div style="font-weight:800;color:#E65100;margin-bottom:8px;">/٦ هل العدد ١٤١ عدد أولي أم غير أولي؟</div>'+
    '<button class="btn-choice" onclick="pick141(0)">أ) عدد أولي</button>'+
    '<button class="btn-choice" onclick="pick141(1)">ب) عدد غير أولي ✅ (١٤١ = ٣ × ٤٧)</button>'+
    '</div>'+

    '<div style="text-align:center;margin-top:12px;">'+
    '<button class="btn btn-primary" onclick="checkS10()">✅ تحقق</button>'+
    '</div>'+
    '<div class="fb" id="fb10"></div>'+
    '</div>';
}
function setEx10(n,type){ex10sel[n]=type;renderS10();}
function pick141(idx){
  window._141ans=idx;
  document.querySelectorAll('#gmain .btn-choice').forEach(function(b){b.style.opacity='.5';});
  document.querySelectorAll('#gmain .btn-choice')[idx].style.opacity='1';
}
function checkS10(){
  var fb=document.getElementById('fb10');
  var unanswered=ex10nums.filter(function(n){return ex10sel[n]===null;});
  if(unanswered.length>0){fb.className='fb err';fb.innerHTML='⚠️ لم تُجب على '+ar(unanswered.length)+' أعداد: '+unanswered.map(ar).join('، ');return;}
  var wrong4=[];
  ex10nums.forEach(function(n){
    var exp=isPrime(n)?'prime':'composite';
    if(ex10sel[n]!==exp)wrong4.push(ar(n));
  });
  var p5a=parseInt(document.getElementById('p5a').value);
  var p5b=parseInt(document.getElementById('p5b').value);
  var p5c=parseInt(document.getElementById('p5c').value);
  var valid5=[p5a,p5b,p5c].filter(function(v){return !isNaN(v)&&v>10&&isPrime(v);});
  var ok141=window._141ans===1;
  if(wrong4.length===0&&valid5.length===3&&ok141){
    fb.className='fb ok';fb.innerHTML='✅ جميع الإجابات صحيحة! الأولية: '+ex10nums.filter(isPrime).map(ar).join('، ')+' — ١٤١ = ٣ × ٤٧ غير أولي!';
    addScore(20);snd('ok');setTimeout(function(){celeb('🌟 رائع!','أتقنت الأعداد الأولية!');},1100);
  }else{
    var msg='';
    if(wrong4.length>0)msg+='❌ خطأ في: '+wrong4.join('، ')+'. ';
    if(valid5.length<3)msg+='⚠️ /٥ اكتب ٣ أعداد أولية >١٠ مثل ١١،١٣،١٧. ';
    if(!ok141)msg+='❌ /٦ ١٤١ = ٣×٤٧ إذن غير أولي!';
    fb.className='fb err';fb.innerHTML=msg;snd('err');
  }
}

// ══════════════════════════════════════════════
// S11 — تمرين عام /٧: تمييز زوجي وفردي من ١٥ عدداً
// ══════════════════════════════════════════════
var ex11nums=[2,3,5,6,7,9,10,11,12,13,15,18,21,28,31,37];
var ex11sel={};

function s11(){
  ex11sel={};
  ex11nums.forEach(function(n){ex11sel[n]=null;});
  renderS11();
}
function renderS11(){
  var chipsHTML='<div class="num-pool">';
  ex11nums.forEach(function(n){
    var cls='neutral';
    if(ex11sel[n]==='even')cls='even';
    else if(ex11sel[n]==='odd')cls='odd';
    chipsHTML+='<div class="num-chip '+cls+'" style="cursor:default;">'+
      '<div>'+ar(n)+'</div>'+
      '<div style="display:flex;gap:4px;margin-top:4px;">'+
      '<button style="border:none;background:#1565C0;color:white;border-radius:5px;padding:2px 6px;font-size:.7rem;cursor:pointer;font-weight:700;" onclick="setEx11('+n+',\'even\')">زوجي</button>'+
      '<button style="border:none;background:#E65100;color:white;border-radius:5px;padding:2px 6px;font-size:.7rem;cursor:pointer;font-weight:700;" onclick="setEx11('+n+',\'odd\')">فردي</button>'+
      '</div></div>';
  });
  chipsHTML+='</div>';

  document.getElementById('gmain').innerHTML=
    '<div class="card">'+
    '<div class="badge">🏆 تمرين عام /٧</div>'+
    '<div class="ctitle">ميّز: زوجي أم فردي؟</div>'+
    '<div class="mascot-row">'+ms()+'<div class="mascot-txt">آخر تمرين قبل التحدي النهائي! لكل عدد اختر: زوجي أم فردي؟ 🎯</div></div>'+
    '<div style="font-size:.82rem;font-weight:700;margin-bottom:8px;color:#555;">📌 انقر "زوجي" أو "فردي" لكل عدد:</div>'+
    chipsHTML+
    '<div style="text-align:center;margin-top:12px;">'+
    '<button class="btn btn-primary" onclick="checkS11()">✅ تحقق</button>'+
    '</div>'+
    '<div class="fb" id="fb11"></div>'+
    '</div>';
}
function setEx11(n,type){ex11sel[n]=type;renderS11();}
function checkS11(){
  var fb=document.getElementById('fb11');
  var unanswered=ex11nums.filter(function(n){return ex11sel[n]===null;});
  if(unanswered.length>0){fb.className='fb err';fb.innerHTML='⚠️ لم تُجب على '+ar(unanswered.length)+' أعداد!';return;}
  var wrong=[];
  ex11nums.forEach(function(n){
    var exp=isEven(n)?'even':'odd';
    if(ex11sel[n]!==exp)wrong.push(ar(n));
  });
  if(wrong.length===0){
    fb.className='fb ok';
    fb.innerHTML='✅ جميع الإجابات صحيحة! الزوجية: '+ex11nums.filter(isEven).map(ar).join('، ')+' — الفردية: '+ex11nums.filter(function(n){return !isEven(n);}).map(ar).join('، ');
    addScore(20);snd('ok');setTimeout(function(){celeb('🏆 ممتاز!','الآن جاهز للتحدي النهائي!');},1100);
  }else{
    fb.className='fb err';fb.innerHTML='❌ خطأ في: '+wrong.join('، ')+'. تذكّر: انظر لرقم الآحاد!';snd('err');
  }
}

// ══════════════════════════════════════════════
// FINAL — التحدي النهائي
// ══════════════════════════════════════════════
var finalA={};
function sFinal(){
  var Qs=[
    {q:'العدد الزوجي هو العدد الذي:',opts:['لا يقبل القسمة على ٢','يمكن تقسيمه إلى عددين متساويين','ينتهي بالرقم ١','يقبل القسمة على ٣ فقط'],ans:1},
    {q:'أيّ الأعداد التالية زوجي؟',opts:['٧','١١','٢٤','٣٧'],ans:2},
    {q:'أيّ الأعداد التالية فردي؟',opts:['٣٢','٤٤','٢٠','٢٥'],ans:3},
    {q:'العدد ٨٩٢٠ هو:',opts:['فردي','زوجي لأن الآحاد = ٠','فردي لأن الآحاد = ٢','لا زوجي ولا فردي'],ans:1},
    {q:'زوجي + زوجي =',opts:['فردي دائماً','زوجي دائماً','أحياناً زوجي وأحياناً فردي','لا يمكن الحكم'],ans:1},
    {q:'فردي + فردي =',opts:['فردي دائماً','زوجي دائماً','أحياناً زوجي وأحياناً فردي','لا يمكن الحكم'],ans:1},
    {q:'زوجي + فردي =',opts:['فردي دائماً','زوجي دائماً','أحياناً زوجي وأحياناً فردي','صفر'],ans:0},
    {q:'هل الصفر عدد زوجي؟',opts:['لا، الصفر ليس زوجياً ولا فردياً','نعم، الصفر عدد زوجي','لا، الصفر عدد فردي','لا يمكن تحديد نوعه'],ans:1},
    {q:'العدد ١٤١ هو:',opts:['عدد أولي','عدد غير أولي (١٤١=٣×٤٧)','عدد زوجي','لا أولي ولا غير أولي'],ans:1},
    {q:'أيّ الأعداد أولي؟',opts:['٩','١٥','١١','٢١'],ans:2},
    {q:'رقم الآحاد في العدد ٣٨٥ هو:',opts:['٣','٨','٥','٣٨'],ans:2},
    {q:'العدد ٣٨٥ هو:',opts:['زوجي','فردي لأن الآحاد = ٥','زوجي لأن الآحاد = ٨','لا يمكن التحديد'],ans:1},
    {q:'أيّ القوائم تحتوي على أعداد زوجية فقط؟',opts:['٢، ٤، ٦، ٩','٢، ٤، ٦، ٨','١، ٣، ٥، ٧','٢، ٣، ٥، ٧'],ans:1},
    {q:'٦ + ٧ =؟ هل الناتج زوجي أم فردي؟',opts:['زوجي','فردي لأن زوجي+فردي=فردي','فردي لأن ٦+٧=١٣','ب وج كلاهما صحيح'],ans:3},
    {q:'أيّ الأعداد التالية كلها فردية؟',opts:['١، ٣، ٥، ٧، ٩','١، ٣، ٥، ٨، ٩','٢، ٣، ٥، ٧، ٩','١، ٣، ٤، ٧، ٩'],ans:0}
  ];

  var qHTML='';
  Qs.forEach(function(q,i){
    qHTML+='<div style="background:#F8FAFF;border-radius:12px;padding:12px;margin-bottom:10px;border:2px solid #BBDEFB;">';
    qHTML+='<div style="font-weight:800;color:#0D47A1;margin-bottom:7px;">سؤال '+ar(i+1)+': '+q.q+'</div>';
    q.opts.forEach(function(opt,oi){
      qHTML+='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:white;border-radius:9px;padding:8px 11px;border:2px solid #E3F2FD;margin-bottom:5px;">';
      qHTML+='<input type="radio" name="fqeo'+i+'" value="'+oi+'" style="width:16px;height:16px;accent-color:#1565C0;" onchange="finalA['+i+']=parseInt(this.value)">';
      qHTML+='<span style="font-size:.88rem;">'+opt+'</span></label>';
    });
    qHTML+='</div>';
  });

  document.getElementById('gmain').innerHTML=
    '<div class="card">'+
    '<div class="badge">🏆 التحدي النهائي</div>'+
    '<div class="ctitle">مراجعة شاملة — '+ar(Qs.length)+' سؤالاً</div>'+
    '<div class="mascot-row">'+ms()+'<div class="mascot-txt">أثبت أنك أتقنت الدرس! أجب على جميع الأسئلة 🏆</div></div>'+
    qHTML+
    '<div style="text-align:center;margin-top:16px;">'+
    '<button class="btn btn-orange" onclick="submitFinal()" style="font-size:1rem;padding:12px 24px;">🏁 إنهاء التحدي</button>'+
    '</div>'+
    '<div class="fb" id="fbFinal" style="margin-top:12px;"></div>'+
    '</div>';
  window._finalQs=Qs;finalA={};
}

function submitFinal(){
  var fb=document.getElementById('fbFinal');
  var Qs=window._finalQs;
  var correct=0,details='';
  Qs.forEach(function(q,i){
    var ok=finalA[i]===q.ans;
    if(ok){correct++;details+='<div style="color:#1B5E20;font-size:.82rem;margin-bottom:2px;">✅ سؤال '+ar(i+1)+': صحيح</div>';}
    else{details+='<div style="color:#C62828;font-size:.82rem;margin-bottom:2px;">❌ سؤال '+ar(i+1)+': الإجابة: '+q.opts[q.ans]+'</div>';}
  });
  var pct=Math.round(correct/Qs.length*100);
  var stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  addScore(correct*5);snd('ok');if(pct>=70)cfetti();
  fb.className='fb ok';fb.style.display='block';
  fb.innerHTML='<div style="font-size:1.4rem;text-align:center;margin-bottom:6px;">'+stars+'</div>'+
    '<div style="font-size:1.1rem;font-weight:900;text-align:center;margin-bottom:10px;">أجبت بشكل صحيح على '+ar(correct)+' من '+ar(Qs.length)+' ('+ar(pct)+'%)</div>'+
    '<div style="max-height:180px;overflow-y:auto;border-top:1px solid #ddd;padding-top:8px;">'+details+'</div>'+
    '<div style="text-align:center;margin-top:12px;"><button class="btn btn-primary" onclick="stage=-1;score=0;updProg();renderIntro();">🔄 العب مجدداً</button></div>';
  setTimeout(function(){fb.scrollIntoView({behavior:'smooth'});},300);
}

renderIntro();
</script>
